<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Command Center - Restricted</title>
    
    <!-- LIBRARY -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow: hidden; background: #0f172a; color: white; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Glass Effect */
        .glass-panel { 
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(56, 189, 248, 0.3); 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        
        /* Map Styling */
        #map-admin { background: #1e293b; z-index: 1; }
        
        /* Filter Dark Mode Berwarna */
        .sci-fi-map .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
        
        .leaflet-control-zoom { display: none !important; }
        .leaflet-control-attribution { display: none !important; }

        /* Marker Pulse Animation */
        .pulse-marker {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pulse-marker::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.5); opacity: 0.8; }
            100% { transform: scale(3); opacity: 0; }
        }

        /* LAYOUT LAYERS */
        .layer-map { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .layer-grid { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; background-image: radial-gradient(rgba(6, 182, 212, 0.1) 1px, transparent 1px); background-size: 40px 40px; opacity: 0.5; }
        
        /* PERBAIKAN DI SINI: flex-direction: column */
        .layer-ui { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; 
            pointer-events: none; padding: 1.5rem; 
            display: flex; flex-direction: column; justify-content: space-between; 
        }
        
        .interactive { pointer-events: auto; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .layer-ui { padding: 10px; }
            .header-container { flex-direction: column; width: 100%; gap: 10px; }
            .header-status { width: 100%; justify-content: space-between; }
            .header-weather { display: none; }
            .hud-left { position: absolute; bottom: 100px; left: 10px; top: auto !important; width: auto !important; }
            .hud-right { display: none; }
            .dock-container { width: 100%; padding: 0 10px; }
            .dock-inner { width: 100%; justify-content: space-around; }
            .dock-label { display: none; }
            #detail-card { bottom: 80px !important; right: 10px !important; left: 10px !important; width: auto !important; }
        }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-gate" class="fixed inset-0 z-[100] bg-gray-950 flex items-center justify-center p-6">
        <div class="glass-panel p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center border-t-4 border-red-600 relative overflow-hidden interactive">
            <div class="mb-6 animate-pulse">
                <ion-icon name="finger-print" class="text-5xl text-red-500"></ion-icon>
            </div>
            <h2 class="text-2xl font-mono font-bold text-white mb-2 tracking-[0.2em]">COMMAND CENTER</h2>
            <p class="text-red-400 text-xs mb-8 font-mono">SECURE LOGIN REQUIRED</p>
            <form onsubmit="event.preventDefault(); checkAuth();" class="space-y-5">
                <input type="password" id="admin-pass" class="w-full p-4 bg-black/50 border border-red-900 rounded-lg focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none text-center text-xl text-white tracking-[0.5em] font-mono transition-all" placeholder="PIN" autofocus>
                <button type="submit" class="w-full bg-red-700 hover:bg-red-600 text-white font-bold py-3.5 rounded-lg tracking-widest font-mono shadow-lg transition-all">
                    INITIATE
                </button>
            </form>
            <div class="mt-6 text-[10px] text-gray-500 font-mono">Hint: admin123</div>
            <a href="JalanSafePublik.html" class="block mt-4 text-xs text-gray-400 hover:text-white hover:underline">Exit to Public Portal</a>
        </div>
    </div>

    <!-- 2. DASHBOARD -->
    <div id="dashboard-ui" class="hidden">
        
        <!-- A. MAP LAYER -->
        <div id="map-admin" class="layer-map sci-fi-map"></div>
        
        <!-- B. DECORATION -->
        <div class="layer-grid"></div>
        <div class="fixed inset-0 z-3 pointer-events-none bg-gradient-to-b from-black/80 via-transparent to-black/80"></div>

        <!-- C. UI LAYER -->
        <div class="layer-ui">
            
            <!-- HEADER -->
            <header class="header-container flex justify-between items-start w-full">
                <div class="header-status glass-panel px-5 py-3 rounded-lg interactive flex items-center gap-5 border-l-4 border-green-500">
                    <div>
                        <div class="text-[9px] text-gray-400 font-bold tracking-widest mb-0.5">SYSTEM STATUS</div>
                        <div class="text-sm font-mono text-white flex items-center gap-2">
                            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> ONLINE
                        </div>
                    </div>
                    <div class="hidden sm:block h-8 w-px bg-gray-700"></div>
                    <div class="text-right">
                        <div class="text-xl font-mono font-bold text-white leading-none" id="clock">00:00</div>
                        <div class="text-[9px] text-gray-500">WIB</div>
                    </div>
                </div>

                <div class="header-weather glass-panel px-5 py-3 rounded-lg interactive flex items-center gap-3 border-r-4 border-yellow-500">
                    <ion-icon name="cloudy-night" class="text-2xl text-yellow-400"></ion-icon>
                    <div class="text-right">
                        <div class="text-lg font-bold leading-none">24°C</div>
                        <div class="text-[9px] text-gray-400 uppercase">Berawan</div>
                    </div>
                </div>
            </header>

            <!-- MIDDLE AREA -->
            <div class="flex-1 relative mt-4 mb-4">
                
                <!-- Left Stats -->
                <div class="hud-left absolute top-0 left-0 w-64 space-y-3 interactive">
                    <div class="glass-panel p-4 rounded-xl border-l-4 border-blue-500 hover:bg-blue-900/30 transition-all cursor-pointer">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[10px] text-blue-300 uppercase font-bold tracking-wider">Laporan</span>
                            <ion-icon name="document-text" class="text-blue-400"></ion-icon>
                        </div>
                        <div class="text-3xl font-mono font-bold text-white">42</div>
                    </div>
                    <div class="glass-panel p-4 rounded-xl border-l-4 border-red-500 hover:bg-red-900/30 transition-all cursor-pointer">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[10px] text-red-300 uppercase font-bold tracking-wider">Kritis</span>
                            <ion-icon name="alert-circle" class="text-red-500 animate-pulse"></ion-icon>
                        </div>
                        <div class="text-3xl font-mono font-bold text-red-500">05</div>
                    </div>
                </div>

                <!-- Right Feed -->
                <div class="hud-right absolute top-0 right-0 w-80 h-full flex flex-col interactive">
                    <div class="glass-panel h-full rounded-xl p-4 flex flex-col max-h-[50vh]">
                        <div class="flex justify-between items-center border-b border-gray-700 pb-2 mb-2">
                            <h3 class="text-[10px] text-cyan-400 font-bold tracking-[0.2em]">LIVE LOGS</h3>
                            <span class="w-1.5 h-1.5 bg-red-500 rounded-full animate-ping"></span>
                        </div>
                        <div id="feed-container" class="flex-1 overflow-y-auto space-y-2 pr-1 font-mono text-xs"></div>
                    </div>
                </div>

            </div>

            <!-- BOTTOM DOCK -->
            <div class="dock-container flex justify-center w-full interactive">
                <div class="dock-inner glass-panel px-6 py-3 rounded-2xl flex items-center gap-4 sm:gap-8 border-b-4 border-cyan-900 transition-colors">
                    <button onclick="openView('operasional')" class="group flex flex-col items-center gap-1 text-cyan-400 hover:text-white transition-colors">
                        <ion-icon name="map" class="text-2xl"></ion-icon>
                        <span class="dock-label text-[9px] uppercase font-bold opacity-60 group-hover:opacity-100">Map</span>
                    </button>
                    <button onclick="openView('tiket')" class="group flex flex-col items-center gap-1 text-gray-500 hover:text-blue-400 transition-colors">
                        <ion-icon name="ticket" class="text-2xl"></ion-icon>
                        <span class="dock-label text-[9px] uppercase font-bold opacity-60 group-hover:opacity-100">Tiket</span>
                    </button>
                    <button onclick="openView('kontraktor')" class="group flex flex-col items-center gap-1 text-gray-500 hover:text-green-400 transition-colors">
                        <ion-icon name="people" class="text-2xl"></ion-icon>
                        <span class="dock-label text-[9px] uppercase font-bold opacity-60 group-hover:opacity-100">Vendor</span>
                    </button>
                    <button onclick="openView('aset')" class="group flex flex-col items-center gap-1 text-gray-500 hover:text-purple-400 transition-colors">
                        <ion-icon name="cube" class="text-2xl"></ion-icon>
                        <span class="dock-label text-[9px] uppercase font-bold opacity-60 group-hover:opacity-100">Aset</span>
                    </button>
                    <div class="w-px h-8 bg-gray-700"></div>
                    <button onclick="logout()" class="group flex flex-col items-center gap-1 text-red-700 hover:text-red-500 transition-colors">
                        <ion-icon name="power" class="text-2xl"></ion-icon>
                        <span class="dock-label text-[9px] uppercase font-bold opacity-60 group-hover:opacity-100">Exit</span>
                    </button>
                </div>
            </div>

        </div>

        <!-- 3. MODAL DETAIL MARKER -->
        <div id="detail-card" class="fixed bottom-6 right-6 w-80 glass-panel rounded-xl p-0 hidden flex-col z-[60] border-l-4 border-cyan-500 interactive animate-[scaleInHoriz_0.3s_ease-out]">
            <div class="h-32 bg-gray-800 relative rounded-t-xl overflow-hidden group">
                <img id="detail-img" src="" class="w-full h-full object-cover opacity-70">
                <div class="absolute inset-0 bg-gradient-to-t from-gray-900 to-transparent"></div>
                <button onclick="closeDetail()" class="absolute top-2 right-2 bg-black/60 hover:bg-red-600 text-white p-1 rounded transition-colors"><ion-icon name="close"></ion-icon></button>
                <div class="absolute bottom-2 left-4">
                    <span id="detail-badge" class="text-[9px] bg-red-600 text-white px-2 py-0.5 rounded uppercase font-bold tracking-wider mb-1 inline-block">CRITICAL</span>
                    <h3 id="detail-title" class="text-sm font-bold text-white drop-shadow-md">Kerusakan Jalan</h3>
                </div>
            </div>
            <div class="p-4 space-y-3">
                <div class="flex justify-between items-center text-xs border-b border-gray-700 pb-2">
                    <span class="text-gray-400">Lokasi</span>
                    <span id="detail-loc" class="text-cyan-400 font-mono text-right truncate w-32">...</span>
                </div>
                <div class="flex justify-between items-center text-xs border-b border-gray-700 pb-2">
                    <span class="text-gray-400">Vendor</span>
                    <span id="detail-vendor" class="text-white font-bold">...</span>
                </div>
                <button class="w-full bg-cyan-900/50 hover:bg-cyan-600 text-cyan-400 hover:text-white border border-cyan-700 rounded py-2 text-xs font-bold transition-all">DISPATCH TEAM</button>
            </div>
        </div>

        <!-- 4. OVERLAYS -->
        <div id="view-tiket" class="admin-view hidden fixed inset-4 md:inset-20 z-[70] glass-panel rounded-2xl p-6 flex flex-col bg-gray-900/95 interactive">
            <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
                <h2 class="text-xl font-bold text-yellow-400 tracking-widest flex items-center gap-3"><ion-icon name="ticket"></ion-icon> INSIDENT TICKET</h2>
                <button onclick="closeViews()" class="text-gray-500 hover:text-white"><ion-icon name="close" class="text-2xl"></ion-icon></button>
            </div>
            <div id="kanban-container" class="flex-1 flex gap-4 overflow-x-auto pb-2"></div>
        </div>

        <div id="view-kontraktor" class="admin-view hidden fixed inset-4 md:inset-20 z-[70] glass-panel rounded-2xl p-6 flex flex-col bg-gray-900/95 interactive">
            <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
                <h2 class="text-xl font-bold text-green-400 tracking-widest flex items-center gap-3"><ion-icon name="people"></ion-icon> VENDOR DATA</h2>
                <button onclick="closeViews()" class="text-gray-500 hover:text-white"><ion-icon name="close" class="text-2xl"></ion-icon></button>
            </div>
            <div class="flex-1 overflow-auto"><table class="w-full text-left text-sm text-gray-400"><tbody id="contractor-table-body"></tbody></table></div>
        </div>

        <div id="view-aset" class="admin-view hidden fixed inset-4 md:inset-20 z-[70] glass-panel rounded-2xl p-6 flex flex-col bg-gray-900/95 interactive">
            <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
                <h2 class="text-xl font-bold text-purple-400 tracking-widest flex items-center gap-3"><ion-icon name="cube"></ion-icon> ASSET DATA</h2>
                <button onclick="closeViews()" class="text-gray-500 hover:text-white"><ion-icon name="close" class="text-2xl"></ion-icon></button>
            </div>
            <div class="flex-1 overflow-auto"><table class="w-full text-left text-sm text-gray-400"><tbody id="asset-table-body"></tbody></table></div>
        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script>
        const MOCK = {
            feed: [
                {id:'LOG-992', txt:'Sensor Banjir #4 Alert', type:'crit', time:'1m'},
                {id:'LOG-991', txt:'PJU Padam: Jl. Dago', type:'warn', time:'12m'},
                {id:'LOG-990', txt:'Patroli Sektor 4 OK', type:'info', time:'45m'},
                {id:'LOG-989', txt:'Tiket #882 Selesai', type:'ok', time:'1h'}
            ],
            contractors: [
                {n:'PT. Beton Jaya', g:'A', s:'98', st:'Aktif'},
                {n:'CV. Terang Jalan', g:'B', s:'85', st:'Idle'},
                {n:'PT. Sinar Infra', g:'A', s:'92', st:'Sibuk'}
            ],
            assets: [{id:'AST-01', l:'Jl. Asia Afrika', s:'Online'}, {id:'AST-02', l:'Jl. Dago', s:'Offline'}],
            tickets: [{t:'Lubang Besar', l:'Jl. Soekarno Hatta', s:'baru'}, {t:'Tiang Miring', l:'Jl. Peta', s:'proses'}]
        };

        let map;

        function checkAuth() {
            if(document.getElementById('admin-pass').value === 'admin123') {
                document.getElementById('login-gate').classList.add('hidden');
                document.getElementById('dashboard-ui').classList.remove('hidden');
                setTimeout(initSystem, 100);
            } else { alert('PIN SALAH (Coba: admin123)'); document.getElementById('admin-pass').value=''; }
        }

        function logout() { if(confirm('Logout?')) window.location.href='JalanSafePublik.html'; }

        function initSystem() {
            setInterval(() => {
                const el = document.getElementById('clock');
                if(el) el.innerText = new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
            }, 1000);

            if(!map) {
                map = L.map('map-admin', { zoomControl: false, attributionControl: false }).setView([-6.9175, 107.6191], 13);
                
                // MAP UTAMA: OPENSTREETMAP
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: ''
                }).addTo(map);

                // Add Markers
                for(let i=0; i<10; i++) {
                    const lat = -6.9175 + (Math.random() - 0.5) * 0.05;
                    const lng = 107.6191 + (Math.random() - 0.5) * 0.05;
                    const type = ['red', 'yellow', 'green'][Math.floor(Math.random()*3)];
                    const color = type==='red'?'#ef4444':(type==='yellow'?'#eab308':'#22c55e');
                    
                    const icon = L.divIcon({
                        className: '',
                        html: `<div class="pulse-marker"><div style="width:12px;height:12px;background:${color};border-radius:50%;border:2px solid white;box-shadow:0 0 10px ${color}"></div></div>`
                    });
                    
                    const m = L.marker([lat, lng], {icon: icon}).addTo(map);
                    m.on('click', () => showDetail(type));
                }
                map.on('click', closeDetail);
            }
            map.invalidateSize();
            renderFeed();
        }

        function showDetail(type) {
            const card = document.getElementById('detail-card');
            const titles = ["Jalan Berlubang", "Sensor IoT Alert", "CCTV Offline", "Genangan Air"];
            const imgUrl = `https://placehold.co/400x200/${type==='red'?'7f1d1d':'064e3b'}/ffffff?text=EVIDENCE`;
            
            document.getElementById('detail-title').innerText = titles[Math.floor(Math.random()*titles.length)];
            document.getElementById('detail-loc').innerText = `Jl. Random No. ${Math.floor(Math.random()*99)}`;
            document.getElementById('detail-vendor').innerText = MOCK.contractors[0].n;
            document.getElementById('detail-img').src = imgUrl;
            
            const badge = document.getElementById('detail-badge');
            badge.className = `text-[9px] px-2 py-0.5 rounded uppercase font-bold tracking-wider mb-1 inline-block ${type==='red'?'bg-red-600 text-white':'bg-green-600 text-white'}`;
            badge.innerText = type==='red'?'CRITICAL':'NORMAL';
            
            card.classList.remove('hidden');
        }

        function closeDetail() { document.getElementById('detail-card').classList.add('hidden'); }

        function renderFeed() {
            const c = document.getElementById('feed-container');
            if(c) c.innerHTML = MOCK.feed.map(f => `
                <div class="p-2 mb-2 rounded bg-white/5 border-l-2 ${f.type==='crit'?'border-red-500':'border-blue-500'} hover:bg-white/10 transition cursor-pointer">
                    <div class="flex justify-between text-[9px] text-gray-500 font-mono"><span>${f.id}</span><span>${f.time}</span></div>
                    <div class="text-[11px] text-gray-200 font-bold">${f.txt}</div>
                </div>`).join('');
        }

        function closeViews() { document.querySelectorAll('.admin-view').forEach(el => el.classList.add('hidden')); }
        function openView(name) {
            closeViews();
            if(name === 'operasional') return;
            const view = document.getElementById(`view-${name}`);
            if(view) {
                view.classList.remove('hidden');
                if(name === 'kontraktor') renderTable('contractor-table-body', MOCK.contractors, ['n','g','s','st']);
                if(name === 'aset') renderTable('asset-table-body', MOCK.assets, ['id','l','s']);
                if(name === 'tiket') renderKanban();
            }
        }

        function renderTable(id, data, keys) {
            const tbody = document.getElementById(id);
            tbody.innerHTML = data.map(r => `<tr class="border-b border-gray-800 hover:bg-white/5">${keys.map(k=>`<td class="p-3 text-gray-300">${r[k]}</td>`).join('')}</tr>`).join('');
        }

        function renderKanban() {
            const c = document.getElementById('kanban-container');
            const cols = ['baru', 'proses'];
            c.innerHTML = cols.map(col => `
                <div class="min-w-[260px] bg-gray-800/50 rounded-xl p-3 border border-gray-700">
                    <div class="text-xs font-bold text-gray-400 uppercase mb-3 border-b border-gray-700 pb-2">${col}</div>
                    ${MOCK.tickets.filter(t=>t.s===col).map(t=>`
                        <div class="bg-gray-900 p-3 rounded mb-2 border-l-2 border-cyan-500">
                            <div class="text-sm font-bold text-white">${t.t}</div>
                            <div class="text-xs text-gray-500 mt-1">${t.l}</div>
                        </div>`).join('')}
                </div>`).join('');
        }
    </script>
</body>
</html>
